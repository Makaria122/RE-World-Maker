name: Build Release

on: 
  workflow_dispatch:

jobs:
  # Build and release the Package
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      packagePath: Packages/com.makaria122.re-world-maker
    steps:

      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@v5

      # Get the Package version based on the package.json file
      - name: Get Version
        run: |
          version=$(jq -r '.version' "${{ env.packagePath }}/package.json")
          test -n "$version"
          test "$version" != "null"
          echo "zipFile=com.makaria122.re-world-maker-${version}.zip" >> "$GITHUB_ENV"
          echo "unityPackage=com.makaria122.re-world-maker-${version}.unitypackage" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_ENV"

      # Zip the Package for release
      - name: Create Package Zip
        working-directory: "${{ env.packagePath }}"
        run: zip -r "${{ github.workspace }}/${{ env.zipFile }}" .
      
      # Make a UnityPackage version of the Package for release
      - name: Create UnityPackage
        shell: python
        run: |
          import io
          import os
          import pathlib
          import re
          import tarfile

          package = pathlib.Path(os.environ["packagePath"])
          output = pathlib.Path(os.environ["unityPackage"])

          with tarfile.open(output, "w:gz", format=tarfile.GNU_FORMAT) as archive:
              for meta in sorted(package.rglob("*.meta")):
                  text = meta.read_text(encoding="utf-8")
                  match = re.search(r"^guid:\s*([0-9a-fA-F]+)\s*$", text, re.MULTILINE)
                  if not match:
                      raise RuntimeError(f"GUID not found in {meta}")

                  guid = match.group(1)
                  asset = meta.with_suffix("")
                  pathname = asset.as_posix().encode("utf-8")

                  archive.add(meta, arcname=f"{guid}/asset.meta", recursive=False)
                  if asset.is_file():
                      archive.add(asset, arcname=f"{guid}/asset", recursive=False)

                  info = tarfile.TarInfo(f"{guid}/pathname")
                  info.size = len(pathname)
                  info.mode = 0o644
                  archive.addfile(info, io.BytesIO(pathname))
      
      # Publish the Release to GitHub
      - name: Make Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.version }}" \
            "${{ env.zipFile }}" \
            "${{ env.unityPackage }}" \
            "${{ env.packagePath }}/package.json" \
            --target "${{ github.sha }}" \
            --title "RE World Maker ${{ env.version }}" \
            --generate-notes
